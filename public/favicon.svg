<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00a3ad"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Radar Telemetry Ring -->
  <circle cx="32" cy="32" r="30" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5" />
  <circle cx="32" cy="32" r="27" fill="url(#shieldGrad)" stroke="#1e293b" stroke-width="1.8" />
  <circle cx="32" cy="32" r="22" stroke="url(#bladeGrad)" stroke-width="1" opacity="0.6" />
  
  <!-- Protective Shield Motif -->
  <path d="M32 11 L46 16 V31 C46 40 32 48 32 48 C32 48 18 40 18 31 V16 Z" fill="#101929" stroke="#00f2fe" stroke-width="1.2" opacity="0.85" />
  
  <!-- 3-Blade Wind Turbine Rotor (Precision Vector) -->
  <!-- Top Blade -->
  <path d="M32 32 L30 14 C30 12 34 12 34 14 L32 32 Z" fill="url(#bladeGrad)" filter="url(#glow)" />
  <!-- Bottom Right Blade -->
  <path d="M32 32 L47.5 41 C49.2 42 47.2 45.5 45.5 44.5 L32 32 Z" fill="url(#bladeGrad)" filter="url(#glow)" />
  <!-- Bottom Left Blade -->
  <path d="M32 32 L16.5 41 C14.8 42 16.8 45.5 18.5 44.5 L32 32 Z" fill="url(#bladeGrad)" filter="url(#glow)" />
  
  <!-- Center Hub Bearing -->
  <circle cx="32" cy="32" r="4.2" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.2" fill="#07090e" />
  
  <!-- Telemetry Sensor Pulse Blips -->
  <circle cx="32" cy="5" r="1.5" fill="#00ff88" />
  <circle cx="59" cy="32" r="1.5" fill="#00f2fe" />
  <circle cx="5" cy="32" r="1.5" fill="#00f2fe" />
  <circle cx="32" cy="59" r="1.5" fill="#00ff88" />
</svg>
